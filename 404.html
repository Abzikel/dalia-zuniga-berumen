<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#312e81" />
    <title>Página no encontrada | Dalia Zúñiga Berumen</title>
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Dalia" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
            --accent: #312e81;
            --accent-hover: #1e1b4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
        }

        .code {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 24px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 10px;
            background: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 600;
            transition: background-color 0.18s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
        }
    </style>
</head>

<body>
    <main class="card">
        <p class="code">Error 404</p>
        <h1>Página no encontrada</h1>
        <p>El enlace que abriste no existe o cambió de ubicación. Puedes regresar al índice principal para abrir cualquier actividad.</p>
        <a id="home-link" class="btn" href="index.html">Ir al índice de actividades</a>
    </main>

    <script>
        // Resolve the repository root cleanly when hosted under the GitHub Pages subpath
        if (location.hostname === 'abzikel.dev') {
            document.getElementById('home-link').href = 'https://abzikel.dev/dalia-zuniga-berumen/';
        }
    </script>
</body>

</html>
